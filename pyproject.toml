[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "firered-rl"
version = "0.28.0"
description = "Gymnasium environments and multiplayer orchestration for Pokemon FireRed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.1,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
lua-test = ["lupa>=2,<3"]
train = ["stable-baselines3==2.7.1", "sb3-contrib==2.7.1", "torch>=2.5,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/firered_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
